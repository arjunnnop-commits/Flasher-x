name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FairyFlasherX-Android-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fairy-Flasher-X-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
