name: Build FAIRY FLASHER X APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FAIRY_FLASHER_X_V2_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f FAIRY_FLASHER_X_V2_Source.zip || {
            echo "Missing FAIRY_FLASHER_X_V2_Source.zip in repository root."
            exit 1
          }
          mkdir -p project
          unzip -q FAIRY_FLASHER_X_V2_Source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Project extracted successfully"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p project assembleDebug

      - name: Verify APK
        run: test -s project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAIRY-FLASHER-X-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
