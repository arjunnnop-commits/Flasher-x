name: Build Fairy Flasher X APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works in two ways:
      #  1) normal repo: settings.gradle.kts is in the repo root
      #  2) you uploaded the source .zip as-is: it is unpacked here automatically
      - name: Find project (unpacks a .zip from the repo root if needed)
        id: src
        shell: bash
        run: |
          ROOT="."
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            shopt -s nullglob
            mkdir -p _unpacked
            for z in *.zip; do
              echo "Unpacking $z"
              unzip -o -q "$z" -d _unpacked
            done
            S=$(find _unpacked -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -n 1)
            if [ -z "$S" ]; then
              echo "::error::No Gradle project found. Upload the source .zip to the repository root."
              exit 1
            fi
            ROOT=$(dirname "$S")
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.src.outputs.root }}
        run: gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find "${{ steps.src.outputs.root }}" -path '*outputs/apk/debug/*.apk' -exec cp {} out/FairyFlasherX.apk \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FairyFlasherX-APK
          path: out/FairyFlasherX.apk

      - name: Upload build log (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
